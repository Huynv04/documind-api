name: DocuMind CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # 1. BACKEND CI (NestJS + PostgreSQL pgvector + Redis)
  # ============================================================
  backend-ci:
    name: Backend Lint, Test & Build (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind-api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind_pass
          POSTGRES_DB: documind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: documind-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://documind:documind_pass@localhost:5432/documind_test?schema=public

      - name: Run Database Migrations
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://documind:documind_pass@localhost:5432/documind_test?schema=public

      - name: Check code formatting & lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run unit & integration tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://documind:documind_pass@localhost:5432/documind_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_key_12345
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_12345

      - name: Build NestJS application
        run: npm run build

  # ============================================================
  # 2. FRONTEND CI (Next.js + TypeScript + Tailwind)
  # ============================================================
  frontend-ci:
    name: Frontend Typecheck & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: documind-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

  # ============================================================
  # 3. DOCKER BUILD CHECK
  # ============================================================
  docker-build:
    name: Docker Image Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./documind-api
          file: ./documind-api/Dockerfile
          push: false
          tags: documind-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

